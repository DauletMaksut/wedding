<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дәулет & Назерке — 06.06.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #5B8C5A;
    --green-light: #7BA87B;
    --green-pale: #D4E6D4;
    --dark: #2D3A2D;
    --white: #ffffff;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem 1.2rem;
    overflow: hidden;
  }

  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('../bg.jpg') center/cover no-repeat;
    filter: brightness(0.25);
  }

  .page::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(45,58,45,0.3) 0%,
      rgba(45,58,45,0.1) 30%,
      rgba(45,58,45,0.2) 70%,
      rgba(45,58,45,0.5) 100%
    );
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    max-width: 400px;
  }

  /* ---- Names ---- */
  .label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.5rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--green-pale);
    margin-bottom: 0.3rem;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.2s forwards;
  }

  .names {
    font-family: 'Lora', 'Noto Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.2rem, 9vw, 3.5rem);
    color: var(--white);
    line-height: 1.15;
    opacity: 0;
    animation: fadeIn 1s ease 0.3s forwards;
  }

  .names .amp {
    font-size: 0.5em;
    color: var(--green-light);
    display: inline;
    margin: 0 0.15em;
  }

  .line {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green-light), transparent);
    margin: 0.6rem 0;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.5s forwards;
  }

  .date {
    font-family: 'Cormorant Garamond', 'Noto Serif', serif;
    font-weight: 300;
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    letter-spacing: 0.2em;
    color: var(--green-pale);
    opacity: 0;
    animation: fadeIn 0.8s ease 0.6s forwards;
  }

  /* ---- Parents ---- */
  .parents {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin: 0.8rem 0;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.7s forwards;
  }

  .parent {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
  }

  .parent img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid rgba(212,230,212,0.4);
  }

  .parent span {
    font-family: 'Cormorant Garamond', 'Noto Serif', serif;
    font-size: 0.7rem;
    color: var(--green-pale);
    font-style: italic;
    opacity: 0.8;
  }

  /* ---- Info ---- */
  .info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin: 0.4rem 0;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.8s forwards;
  }

  .info-item {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--green-pale);
    padding: 0.3rem 0.6rem;
    border: 1px solid rgba(123,168,123,0.25);
    white-space: nowrap;
  }

  .info-dot {
    width: 3px;
    height: 3px;
    background: var(--green-light);
    border-radius: 50%;
    opacity: 0.5;
  }

  /* ---- 2GIS button ---- */
  .map-btn {
    display: inline-block;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--green-pale);
    text-decoration: none;
    padding: 0.4rem 1rem;
    border: 1px solid rgba(123,168,123,0.35);
    transition: all 0.3s ease;
    margin: 0.3rem 0;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.9s forwards;
  }

  .map-btn:hover {
    background: rgba(123,168,123,0.15);
    border-color: var(--green-light);
  }

  /* ---- RSVP ---- */
  .rsvp {
    width: 100%;
    margin-top: 0.6rem;
    opacity: 0;
    animation: fadeIn 0.8s ease 1s forwards;
  }

  .rsvp-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.5rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--green-light);
    margin-bottom: 0.5rem;
  }

  .rsvp-row {
    display: flex;
    gap: 0;
    width: 100%;
  }

  .rsvp-input {
    flex: 1;
    padding: 0.7rem 0.8rem;
    font-family: 'Cormorant Garamond', 'Noto Serif', serif;
    font-size: 0.95rem;
    color: var(--white);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(123,168,123,0.25);
    border-right: none;
    outline: none;
    transition: border-color 0.3s ease;
  }

  .rsvp-input::placeholder { color: rgba(212,230,212,0.3); }
  .rsvp-input:focus { border-color: var(--green-light); }

  .rsvp-btn {
    padding: 0.7rem 1.2rem;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dark);
    background: var(--green-light);
    border: 1px solid var(--green-light);
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .rsvp-btn:hover { background: var(--green); border-color: var(--green); }
  .rsvp-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .rsvp-msg {
    font-family: 'Cormorant Garamond', 'Noto Serif', serif;
    font-size: 0.85rem;
    color: var(--green-pale);
    margin-top: 0.4rem;
    display: none;
  }

  .rsvp-msg.show { display: block; }

  .rsvp-msg.error { color: #e8a0a0; }

  /* ---- Music button ---- */
  .music-btn {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 10;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(123,168,123,0.3);
    background: rgba(45,58,45,0.7);
    backdrop-filter: blur(8px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .music-btn:hover {
    background: rgba(45,58,45,0.9);
    border-color: var(--green-light);
  }

  .music-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .music-bar {
    width: 2px;
    background: var(--green-light);
    border-radius: 1px;
  }

  .music-btn.playing .music-bar {
    animation: bar 0.8s ease infinite alternate;
  }

  .music-bar:nth-child(1) { height: 4px; animation-delay: 0s; }
  .music-bar:nth-child(2) { height: 8px; animation-delay: 0.15s; }
  .music-bar:nth-child(3) { height: 6px; animation-delay: 0.3s; }
  .music-bar:nth-child(4) { height: 10px; animation-delay: 0.1s; }

  .music-btn:not(.playing) .music-bar { height: 3px !important; animation: none; }

  @keyframes bar { 0% { height: 3px; } 100% { height: 12px; } }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Desktop: чуть больше отступы ---- */
  @media (min-height: 750px) {
    .parents { margin: 1rem 0; }
    .info { margin: 0.6rem 0; }
    .rsvp { margin-top: 1rem; }
    .names { font-size: clamp(2.5rem, 8vw, 4rem); }
    .parent img { width: 64px; height: 64px; }
  }
</style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
  <source src="../song.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" id="musicBtn" onclick="toggleMusic(event)">
  <div class="music-bars">
    <div class="music-bar"></div>
    <div class="music-bar"></div>
    <div class="music-bar"></div>
    <div class="music-bar"></div>
  </div>
</button>

<div class="page">
  <div class="content">
    <p class="label">Біз үйленеміз</p>

    <h1 class="names">Дәулет <span class="amp">&</span> Назерке</h1>

    <div class="line"></div>

    <p class="date">06 . 06 . 2026</p>

    <div class="parents">
      <div class="parent">
        <img src="../father.jpg" alt="Әкесі">
        <span>Әкесі</span>
      </div>
      <div class="parent">
        <img src="../mother.jpg" alt="Анасы">
        <span>Анасы</span>
      </div>
    </div>

    <div class="info">
      <span class="info-item">📍 Baq Sarai</span>
      <span class="info-dot"></span>
      <span class="info-item">🕐 16:00</span>
      <span class="info-dot"></span>
      <span class="info-item">📅 6 маусым</span>
    </div>

    <a class="map-btn" href="https://2gis.kz/almaty/firm/70000001036418976?m=76.83073%2C43.206801%2F16" target="_blank" rel="noopener">
      📌 2ГІС-те ашу
    </a>

    <div class="rsvp">
      <p class="rsvp-title">Қатысуыңызды растаңыз</p>
      <form id="rsvp-form" onsubmit="submitRSVP(event)">
        <div class="rsvp-row">
          <input class="rsvp-input" type="text" id="fullname" placeholder="Аты-жөніңіз" required>
          <button class="rsvp-btn" type="submit" id="submit-btn">Растау</button>
        </div>
      </form>
      <p class="rsvp-msg" id="rsvp-success">✓ Рахмет! Сізді тойда күтеміз!</p>
      <p class="rsvp-msg error" id="rsvp-error">Қате орын алды. Қайта көріңіз.</p>
    </div>
  </div>
</div>

<script>
  // Music
  (function() {
    const m = document.getElementById('bgMusic');
    const b = document.getElementById('musicBtn');
    let s = false;
    function go() {
      if (s) return; s = true;
      m.volume = 0.4;
      m.play().then(() => b.classList.add('playing')).catch(() => {});
    }
    document.addEventListener('click', go, { once: true });
    document.addEventListener('touchstart', go, { once: true });
  })();

  function toggleMusic(e) {
    e.stopPropagation();
    const m = document.getElementById('bgMusic');
    const b = document.getElementById('musicBtn');
    m.paused ? (m.play(), b.classList.add('playing')) : (m.pause(), b.classList.remove('playing'));
  }

  // RSVP
  const URL = 'https://script.google.com/macros/s/AKfycbzK-nStaF5AabZAbaeYYj4AFXBVsWEjFJnrwBtqM9rJ2ZtF6qHQUxH45pt9xCLRjaR3/exec';

  async function submitRSVP(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '...';

    try {
      await fetch(URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          primary: { firstName: document.getElementById('fullname').value.trim(), lastName: '' },
          guests: [], totalCount: 1, event: 'wedding'
        })
      });
      document.getElementById('rsvp-form').style.display = 'none';
      document.getElementById('rsvp-success').classList.add('show');
    } catch {
      document.getElementById('rsvp-error').classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Растау';
    }
  }
</script>

</body>
</html>
